plugins {
    id 'fabric-loom' version '1.19-SNAPSHOT'
    id 'ploceus' version '1.19-SNAPSHOT'
}

base {
    archivesName = project.archives_base_name
}
version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://fastdl.crazyh.fun/maven' }
    maven { url 'https://maven.enginehub.org/repo/' }
}

loom {
    accessWidenerPath = file("src/main/resources/worldedit-bridge.accesswidener")
}

ploceus {
    setIntermediaryGeneration(2)
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
//    mappings ploceus.featherMappings(project.feather_build)
    mappings ploceus.mcpMappings("stable", "1.12", "39")
    exceptions ploceus.raven(project.raven_build) // remove this line if not using exceptions patches
    signatures ploceus.sparrow(project.sparrow_build) // remove this line if not using generics patches

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // worldedit depends, ship in jar
    // not likely to change, so they just stay here
    include(implementation "com.sk89q.worldedit:worldedit-core:6.1")
    include(implementation "com.sk89q:jchronic:0.2.4a")
    include(implementation "com.thoughtworks.paranamer:paranamer:2.6")
    include(implementation "com.sk89q.lib:jlibnoise:1.0.0")
}

processResources {
    inputs.property 'version', version

    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.named('runClient') {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 8
}

java {
    // Still required by IDEs such as Eclipse and Visual Studio Code
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    // If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
    // Uncomment this line to generate them.
    // withJavadocJar()
}

// If you plan to use a different file for the license, don't forget to change the file name here!
jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}